[project]
name = "apps-dashboard"
version = "0.1.0"
description = "Every web app this Mac serves: status, links, codebase and LaunchAgent, on the tailnet"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
apps-dashboard = "apps_dashboard.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps_dashboard*"]

[tool.setuptools.package-data]
apps_dashboard = ["static/*"]
